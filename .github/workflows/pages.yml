name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Start local server
        run: |
          python3 -m http.server 8000 >/tmp/server.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:8000/ >/dev/null && break; sleep 0.5; done

      - name: Check every page asset is served
        run: |
          for f in index.html 404.html manifest.webmanifest robots.txt sitemap.xml $(find src assets -type f); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8000/$f")
            [ "$code" = 200 ] || { echo "::error::$f returned $code"; exit 1; }
          done

      - name: Run browser unit tests (headless Chrome, no npm)
        run: tests/run-headless.sh

  deploy:
    # Only publish from main, and only after tests pass.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Assemble site
        # Copy only the files the site needs (no docs or dotfiles).
        run: |
          mkdir _site
          cp -r index.html 404.html manifest.webmanifest robots.txt sitemap.xml .nojekyll assets src tests _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
